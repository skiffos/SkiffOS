# NetworkManager marks USB gadget interfaces (g_ether usb0) unmanaged by
# default.  The CHIP uses usb0 as its primary access path (SSH over the
# OTG cable, board=10.42.0.2 host=10.42.0.1) — force it managed so the
# seeded usb-gadget profile autoconnects at boot.
[device-usb-gadget]
match-device=interface-name:usb0
managed=1
